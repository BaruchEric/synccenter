groups:
  - name: synccenter
    interval: 1m
    rules:
      - alert: SyncCenterAPIDown
        expr: up{job="synccenter"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "SyncCenter API is unreachable"
          runbook: "docs/runbooks/synccenter-api-down.md"

      - alert: SyncCenterHostOffline
        expr: synccenter_host_online == 0
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "Syncthing daemon on {{ $labels.host }} is offline"
          runbook: "docs/runbooks/syncthing-host-down.md"

      - alert: SyncCenterFolderHasConflicts
        expr: synccenter_conflicts_open > 0
        for: 1h
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} unresolved conflicts"
          runbook: "docs/runbooks/resolve-conflicts.md"

      - alert: SyncCenterFolderErrors
        expr: synccenter_folder_errors > 0 or synccenter_folder_pull_errors > 0
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "Folder {{ $labels.folder }} on {{ $labels.host }} has errors"

      - alert: SyncCenterFolderOutOfSyncLong
        expr: synccenter_folder_state_info{state="syncing"} == 1
        for: 6h
        labels:
          severity: warn
        annotations:
          summary: "Folder {{ $labels.folder }} on {{ $labels.host }} has been syncing for 6h+"

      - alert: SyncCenterApplyFailures
        expr: increase(synccenter_apply_total{result="error"}[1h]) > 0
        labels:
          severity: warn
        annotations:
          summary: "Apply failures in the last hour: {{ $value }}"

      # The silent one. Syncthing discards the ENTIRE ignore file when a single
      # pattern is unsupported, so the folder starts replicating everything the
      # ruleset exists to keep out — secrets included — while state, error and
      # need counts all stay green. On 2026-08-05 that ran unnoticed for two
      # days on both arik members. Page on it: nothing else notices.
      - alert: SyncCenterIgnoreFileRejected
        # Joined against state_info on purpose. Syncthing answers db/ignores
        # with HTTP 200 and error="folder X does not exist" for a folder that
        # is in the manifest but not yet applied to that host, which would page
        # on benign config. A folder with no live status has no state_info
        # sample, so the join drops it.
        expr: synccenter_folder_ignores_error > 0 and on(folder, host) synccenter_folder_state_info == 1
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Folder {{ $labels.folder }} on {{ $labels.host }} is syncing with NO ignore rules (ignore file rejected)"

      - alert: SyncCenterScrapeBackendErrors
        expr: synccenter_folder_scrape_error == 1
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Metrics scrape failing for {{ $labels.folder }} on {{ $labels.host }} ({{ $labels.reason }})"
